name: BCR Remesas - Descarga y Sube a Blob

on:
  schedule:
    - cron: '30 15 28 * *'   # Viernes 8:00 AM Guatemala (UTC-6)
  workflow_dispatch:         # Ejecución manual desde la UI de GitHub

jobs:
  descargar-remesas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: 🎭 Instalar Playwright + Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🚀 Ejecutar pipeline
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: python scripts/bcr_remesas.py
